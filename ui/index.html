<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tax Reconciliation Bot</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: #1e293b;
    border-bottom: 1px solid #334155;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { font-size: 16px; font-weight: 600; color: #f1f5f9; }
  header p  { font-size: 12px; color: #64748b; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #22c55e; margin-left: auto;
    box-shadow: 0 0 6px #22c55e;
  }

  /* ── Chat area ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .message { display: flex; gap: 10px; max-width: 820px; }
  .message.user { flex-direction: row-reverse; align-self: flex-end; }
  .message.bot  { align-self: flex-start; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 14px; margin-top: 2px;
  }
  .message.bot  .avatar { background: linear-gradient(135deg, #2563eb, #7c3aed); }
  .message.user .avatar { background: #334155; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    max-width: 680px;
  }
  .message.bot  .bubble {
    background: #1e293b;
    border: 1px solid #334155;
    border-top-left-radius: 4px;
  }
  .message.user .bubble {
    background: #2563eb;
    border-top-right-radius: 4px;
    color: #fff;
  }

  /* Markdown-ish rendering */
  .bubble strong { font-weight: 600; color: #93c5fd; }
  .message.user .bubble strong { color: #bfdbfe; }
  .bubble em     { color: #94a3b8; font-style: italic; }
  .bubble code   { background: #0f172a; padding: 1px 5px; border-radius: 4px;
                   font-family: 'Cascadia Code', monospace; font-size: 13px; color: #a5f3fc; }
  .bubble ul, .bubble ol { padding-left: 20px; margin-top: 6px; }
  .bubble li     { margin-bottom: 4px; }
  .bubble blockquote {
    border-left: 3px solid #2563eb; padding-left: 10px;
    color: #64748b; margin-top: 8px; font-size: 13px;
  }

  /* Report link button */
  .report-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 8px 14px;
    background: #1d4ed8; color: #fff; border-radius: 8px;
    font-size: 13px; font-weight: 500; text-decoration: none;
    transition: background 0.2s;
  }
  .report-btn:hover { background: #2563eb; }

  /* Typing indicator */
  .typing .bubble { padding: 14px 18px; }
  .dot-flashing {
    display: flex; gap: 5px; align-items: center; height: 14px;
  }
  .dot-flashing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #64748b; animation: blink 1.2s infinite;
  }
  .dot-flashing span:nth-child(2) { animation-delay: 0.2s; }
  .dot-flashing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.9); }
    40%            { opacity: 1;   transform: scale(1.1); }
  }

  /* ── Suggestions ── */
  #suggestions {
    padding: 0 24px 12px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    background: #1e293b; border: 1px solid #334155;
    padding: 6px 14px; border-radius: 20px; font-size: 12px;
    color: #94a3b8; cursor: pointer; transition: all 0.15s;
    white-space: nowrap;
  }
  .chip:hover { background: #2563eb; border-color: #2563eb; color: #fff; }

  /* ── Input bar ── */
  #input-bar {
    background: #1e293b;
    border-top: 1px solid #334155;
    padding: 14px 20px;
    display: flex; gap: 10px; align-items: flex-end;
    flex-shrink: 0;
  }
  #msg {
    flex: 1;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    color: #e2e8f0;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.2s;
    font-family: inherit;
  }
  #msg:focus { border-color: #2563eb; }
  #msg::placeholder { color: #475569; }
  #send {
    width: 44px; height: 44px; border-radius: 12px;
    background: #2563eb; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
  }
  #send:hover   { background: #1d4ed8; }
  #send:disabled { background: #1e293b; cursor: not-allowed; }
  #send svg { width: 18px; height: 18px; fill: #fff; }
</style>
</head>
<body>

<header>
  <div class="logo">🧾</div>
  <div>
    <h1>Tax Reconciliation Bot</h1>
    <p>ERP × Income Tax Portal · Powered by LLaMA 3.3</p>
  </div>
  <div class="status-dot" title="Online"></div>
</header>

<div id="chat"></div>

<div id="suggestions">
  <span class="chip" onclick="send(this.textContent)">Fetch ERP data for March 2025</span>
  <span class="chip" onclick="send(this.textContent)">Check 26AS for March 2025</span>
  <span class="chip" onclick="send(this.textContent)">Why is my tax different for March 2025?</span>
  <span class="chip" onclick="send(this.textContent)">Generate the report for March 2025</span>
</div>

<div id="input-bar">
  <textarea id="msg" rows="1" placeholder="Ask anything — e.g. 'Why is my TDS different for March 2025?'"
            onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send" onclick="send()" title="Send">
    <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
  </button>
</div>

<script>
  const chat = document.getElementById('chat');
  const msgBox = document.getElementById('msg');
  const sendBtn = document.getElementById('send');
  const suggestions = document.getElementById('suggestions');

  // ── Welcome message ──
  window.addEventListener('load', () => {
    addBotMessage("👋 Hello! I'm your **Tax Reconciliation Bot**.\n\nI can:\n- Fetch ERP (SAP) data for any period\n- Download your 26AS / AIS from the Income Tax portal\n- Compare both and find mismatches\n- Generate a full HTML/PDF report with explanations\n\nTry one of the suggestions below, or just ask me anything.");
  });

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function renderMarkdown(text) {
    return text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,     '<em>$1</em>')
      .replace(/`(.+?)`/g,       '<code>$1</code>')
      .replace(/^> (.+)$/gm,     '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/gm,     '<li>$1</li>')
      .replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>')
      .replace(/\n\n/g,          '</p><p>')
      .replace(/\n/g,            '<br>')
      .replace(/^(.+)$/s,        '<p>$1</p>');
  }

  function addUserMessage(text) {
    const div = document.createElement('div');
    div.className = 'message user';
    div.innerHTML = `
      <div class="avatar">👤</div>
      <div class="bubble">${text.replace(/</g,'&lt;')}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  function addBotMessage(text, reportPath) {
    const div = document.createElement('div');
    div.className = 'message bot';
    let extra = '';
    if (reportPath) {
      extra = `<a class="report-btn" href="${reportPath}" target="_blank">
                 📄 Open Report
               </a>`;
    }
    div.innerHTML = `
      <div class="avatar">🧾</div>
      <div class="bubble">${renderMarkdown(text)}${extra}</div>`;
    chat.appendChild(div);
    scrollToBottom();
  }

  function addTyping() {
    const div = document.createElement('div');
    div.className = 'message bot typing';
    div.id = 'typing';
    div.innerHTML = `
      <div class="avatar">🧾</div>
      <div class="bubble">
        <div class="dot-flashing"><span></span><span></span><span></span></div>
      </div>`;
    chat.appendChild(div);
    scrollToBottom();
    return div;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  async function send(text) {
    const message = text || msgBox.value.trim();
    if (!message) return;

    suggestions.style.display = 'none';
    addUserMessage(message);
    msgBox.value = '';
    msgBox.style.height = 'auto';
    sendBtn.disabled = true;

    const typing = addTyping();

    try {
      const res  = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message})
      });
      const data = await res.json();
      removeTyping();
      addBotMessage(data.reply, data.report_path);
    } catch (err) {
      removeTyping();
      addBotMessage('Sorry, something went wrong. Please try again.');
    }

    sendBtn.disabled = false;
    msgBox.focus();
  }
</script>
</body>
</html>
